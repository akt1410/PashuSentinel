name: Pashu Sentinel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & ML Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG Knowledge & Retrieval Suite
        run: |
          python test_rag.py

      - name: Run ML Intelligence Engine Smoke Tests
        run: |
          python scripts/test_ml.py

      - name: Run Engine Benchmark Suite
        run: |
          python scripts/benchmark_engine.py

  frontend-build:
    name: Frontend PWA Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite PWA
        run: npm run build
        env:
          VITE_API_URL: https://api.pashusentinel.gov.in

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "Vite PWA production build successful."
